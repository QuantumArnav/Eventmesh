name: CI

on:
  push:
  pull_request:

jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run evaluate
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Build deployment image
        run: docker build -t eventmesh-release .
      - name: Smoke deployment image with persistent SQLite mount
        run: |
          set -euo pipefail
          stage="first container startup"
          on_error() {
            code=$?
            trap - ERR
            echo "::error::Persistence smoke failed during $stage (exit $code)"
            docker logs --tail 12 eventmesh-smoke 2>&1 | while IFS= read -r line; do echo "::error::container: $line"; done || true
            exit "$code"
          }
          trap on_error ERR
          mkdir -p "$RUNNER_TEMP/eventmesh-data"
          docker run -d --name eventmesh-smoke -p 3300:3000 -v "$RUNNER_TEMP/eventmesh-data:/app/prisma/data" eventmesh-release
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3300/api/health > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3300/api/health
          stage="create persistent event"
          payload='{"event":{"title":"CI Persistent Event","organizer":"Release CI","description":"Checks data survives a fresh container with the same volume.","date":"2030-01-01","startTime":"10:00","endTime":"11:00","venue":"CI Test Room","category":"Technical","tags":["CI"],"registrationDeadline":null,"expectedAudience":20}}'
          response=$(curl --fail-with-body -sS -X POST http://127.0.0.1:3300/api/events -H 'Content-Type: application/json' --data "$payload")
          event_id=$(printf '%s' "$response" | node -e "let s=''; process.stdin.on('data', c => s += c).on('end', () => process.stdout.write(JSON.parse(s).id))")
          test -n "$event_id"
          stage="recreate container with existing volume"
          docker rm -f eventmesh-smoke
          docker run -d --name eventmesh-smoke -p 3301:3000 -v "$RUNNER_TEMP/eventmesh-data:/app/prisma/data" eventmesh-release
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3301/api/health > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3301/api/health
          stage="read persistent event after recreation"
          curl --fail-with-body -fsS "http://127.0.0.1:3301/api/events/$event_id" |
            node -e "let s=''; process.stdin.on('data', c => s += c).on('end', () => { if (JSON.parse(s).title !== 'CI Persistent Event') process.exit(1) })"
      - name: Stop smoke container
        if: always()
        run: docker rm -f eventmesh-smoke || true
