name: CI

on:
  push:
  pull_request:

jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run evaluate
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Build deployment image
        run: docker build -t eventmesh-release .
      - name: Smoke deployment image with persistent SQLite mount
        run: |
          mkdir -p "$RUNNER_TEMP/eventmesh-data"
          docker run -d --name eventmesh-smoke -p 3300:3000 -v "$RUNNER_TEMP/eventmesh-data:/app/prisma/data" eventmesh-release
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3300/api/health; then exit 0; fi
            sleep 2
          done
          docker logs eventmesh-smoke
          exit 1
      - name: Stop smoke container
        if: always()
        run: docker rm -f eventmesh-smoke || true
